<!DOCTYPE html>
<html>
    <head>
        <title>Chuckles McGiggles</title>
    </head>
    <body>
        <button onclick="toggleAbout()"><h1>Chuckles McGiggles</h1></button>
        <hr>
        <img id="img" src="./charlieMeyer.jpeg">
        <p id="about"></p>
    </body>
    <style>
        body {
            background-color: #111;
            color: white;
        }
        button {
            background-color: transparent;
            border: none;
            color: white;
            cursor: pointer;
        }
        .about {
            display: none;
        }
    </style>
    <script>
        let toggle = false;
        const img = document.getElementById("img");
        const about = document.getElementById("about");

        function toggleAbout() {
            toggle = !toggle;

            if (toggle) {
                img.style.display = "none";
                about.style.display = "block";
                about.textContent = `This is our Muscle Man Charlie Meyer, or Chuckles McGiggles for short (TheBigChucklesMcGiggles@charliemeyer.org). Chuck is our guy. Chuck is the real og ‘67 sailor’. He’s very 67 while he’s on his exceptionally sexy boat, Ghost, which is a Farr 40. Yearly, Master Meyer sails in the very famous and very well known Chicago Yacht Club Race to Mackinac by Wintrust boat race. This is a yearly pilgrimage for the esteemed Mr. McGiggles. When he’s not on his primary water craft, Ghost, he's on the less sexy and exquisite vessel Photon stealing all of the soft shackles for Ghost. Mr Meyer has many profound catch phrases in his vocabulary that have spread far and wide. The most exquisite and well known are "It's Chill", "Big Chill", "Big Unforch", "It's Unforch", "oo (subtle head nod)", and "Yesss (Fist pull)". The one thing Mr Chuckles loves more than sailing, however, is Uno. Should you receive an invitation to his place of residence, he will command your presence in a game with him. Upon your acceptance to his Uno endeavor, he usually concludes with his signature and iconic “Yesss (Fist pull)”.`;
            } else {
                img.style.display = "block";
                about.style.display = "none";
            }
        }
    </script>
</html>
